<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bhishi Group Manager</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-500: #64748b;
      --gray-700: #334155;
      --gray-900: #0f172a;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--gray-50); color: var(--gray-900); padding-bottom: calc(75px + var(--safe-bottom)); min-height: 100vh; }
    
    header {
      background: white; border-bottom: 1px solid var(--gray-200); position: sticky; top: 0; z-index: 40;
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; color: var(--primary); }
    .status-badge { font-size: 0.72rem; padding: 4px 8px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .status-syncing { background: var(--warning-light); color: var(--warning); }
    .status-online { background: var(--success-light); color: var(--success); }

    .container { max-width: 720px; margin: 0 auto; padding: 16px; }

    /* Top Stats Card */
    .metric-card {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: white; border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.3);
    }
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; text-align: center; }
    .metric-sub { background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); padding: 8px; border-radius: 10px; }
    .metric-sub span { display: block; font-size: 0.7rem; opacity: 0.85; text-transform: uppercase; font-weight: 600; }
    .metric-sub strong { font-size: 1.05rem; }

    /* Members Grid */
    .section-title { font-size: 1rem; font-weight: 700; color: var(--gray-700); margin: 16px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .member-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media (min-width: 500px) { .member-grid { grid-template-columns: 1fr 1fr; } }
    
    .member-card {
      background: white; border: 1.5px solid var(--gray-200); border-radius: 14px; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between; gap: 10px; transition: transform 0.1s;
    }
    .member-card.paid { border-color: var(--success); background-color: #fafffc; }
    .member-card.has-taken { background-color: var(--gray-100); opacity: 0.85; border-color: var(--gray-200); }
    .member-card.current-winner { border-color: var(--warning); background-color: #fffdf5; box-shadow: 0 0 0 2px var(--warning); }
    
    .member-top { display: flex; align-items: center; justify-content: space-between; }
    .member-info { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--gray-100); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .name-block strong { display: block; font-size: 0.95rem; font-weight: 700; color: var(--gray-900); }
    .name-block small { color: var(--gray-500); font-size: 0.75rem; }

    .tag { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
    .tag-taken { background: #e2e8f0; color: #475569; }
    .tag-winner { background: var(--warning-light); color: var(--warning); }
    .tag-eligible { background: var(--primary-light); color: var(--primary); }

    .member-actions { display: flex; gap: 6px; align-items: center; }
    .btn-toggle-paid {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: none; font-size: 0.82rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-paid { background: var(--success-light); color: var(--success); border: 1px solid var(--success); }
    .btn-unpaid { background: var(--danger-light); color: var(--danger); border: 1px solid var(--danger); }
    .btn-wa { background: #e0f2fe; color: #0284c7; padding: 8px 10px; border-radius: 8px; border: none; font-size: 0.82rem; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; }

    /* Navigation Bar */
    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--gray-200);
      display: flex; justify-content: space-around; padding: 8px 0 calc(8px + var(--safe-bottom)) 0; z-index: 50;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.7rem; font-weight: 600;
      color: var(--gray-500); background: none; border: none; cursor: pointer; flex: 1;
    }
    .nav-item.active { color: var(--primary); font-weight: 700; }
    .nav-item svg { width: 22px; height: 22px; }

    /* Views */
    .view-panel { display: none; }
    .view-panel.active { display: block; }

    /* Wheel Section */
    .wheel-container { display: flex; flex-direction: column; align-items: center; background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--gray-200); }
    #wheelCanvas { max-width: 320px; width: 100%; height: auto; margin-bottom: 16px; border-radius: 50%; }
    .btn-spin {
      background: var(--primary); color: white; border: none; font-size: 1rem; font-weight: 800;
      padding: 12px 32px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      width: 100%; max-width: 280px;
    }
    .btn-spin:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Register Table */
    .table-card { background: white; border-radius: 16px; border: 1px solid var(--gray-200); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--gray-100); white-space: nowrap; }
    th { background: var(--gray-50); font-weight: 700; color: var(--gray-700); }
    td.member-cell { text-align: left; font-weight: 700; position: sticky; left: 0; background: white; }

    /* Chat Section */
    .chat-container { background: white; border-radius: 16px; border: 1px solid var(--gray-200); height: calc(100vh - 240px); display: flex; flex-direction: column; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; line-height: 1.3; }
    .chat-bubble.mine { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
    .chat-bubble.theirs { align-self: flex-start; background: var(--gray-100); color: var(--gray-900); border-bottom-left-radius: 2px; }
    .chat-meta { font-size: 0.65rem; opacity: 0.75; margin-bottom: 3px; font-weight: 600; }
    .chat-input-row { padding: 10px; border-top: 1px solid var(--gray-200); display: flex; gap: 8px; }
    .chat-input-row input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--gray-200); font-size: 0.9rem; }
    .chat-input-row button { background: var(--primary); color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: 700; }

    .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px 0 10px; }
    .chip { font-size: 0.72rem; background: var(--primary-light); color: var(--primary); border: none; padding: 4px 10px; border-radius: 999px; white-space: nowrap; font-weight: 600; cursor: pointer; }
  </style>
</head>

  <header>

      <span>💰</span>

          </div>
          <div style="text-align:right;">

            <h2 id="potTotal" style="font-size:1.5rem; font-weight:800; color:#fde047;">₹35,000</h2>
          </div>
        </div>

          <div class="metric-sub">
            <span>Per Member</span>
            <strong id="perHeadAmount">₹3,500</strong>

            <span>Collected</span>
            <strong id="collectedAmount">₹0</strong>
          </div>
          <div class="metric-sub">
            <span>Remaining</span>
            <strong id="remainingAmount">₹35,000</strong>
          </div>
        </div>
      </div>

      <div class="section-title">
        <span>Members (10)</span>
        <small id="paidRatioText" style="color:var(--gray-500); font-weight:600;">0/10 Paid</small>
      </div>

      <div id="membersContainer" class="member-grid"></div>
    </section>

    <!-- 2. REGISTER / LEDGER TAB -->
    <section id="tab-register" class="view-panel">
      <div class="section-title">
        <span>10-Month Master Ledger</span>
      </div>
      <div class="table-card">
        <table>

              <th>M6</th><th>M7</th><th>M8</th><th>M9</th><th>M10</th>
            </tr>
          </thead>
          <tbody id="registerTableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- 3. LUCKY WHEEL TAB -->
    <section id="tab-wheel" class="view-panel">
      <div class="section-title">
        <span>Lucky Draw Wheel</span>
      </div>
      <div class="wheel-container">
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <button class="btn-spin" id="spinButton" onclick="spinWheel()">SPIN FOR MONTH POT</button>
        <h3 id="wheelAnnouncement" style="margin-top:14px; text-align:center; color:var(--primary);"></h3>
      </div>
    </section>

    <!-- 4. CHAT TAB -->
    <section id="tab-chat" class="view-panel">
      <div class="quick-chips">
        <button class="chip" onclick="quickSend('✅ Paid ₹3,500 via UPI!')">✅ Paid ₹3,500</button>
        <button class="chip" onclick="quickSend('📸 Sent payment screenshot')">📸 Sent Screenshot</button>
        <button class="chip" onclick="quickSend('🎯 When is this month\'s lucky draw?')">🎯 Lucky Draw Date?</button>
      </div>
      <div class="chat-container" style="margin-top:10px;">
        <div class="chat-messages" id="chatList"></div>
        <div class="chat-input-row">
          <input type="text" id="chatSenderName" placeholder="Your Name" style="width:28%;" />
          <input type="text" id="chatTextInput" placeholder="Type a message or UPI ref..." onkeydown="if(event.key==='Enter') sendChatMessage()" />
          <button onclick="sendChatMessage()">Send</button>
        </div>
      </div>
    </section>

    <!-- 5. ADMIN TAB -->
    <section id="tab-admin" class="view-panel">
      <div class="section-title">
        <span>Organizer Controls</span>
      </div>
      <div style="background:white; border-radius:14px; border:1px solid var(--gray-200); padding:16px; display:flex; flex-direction:column; gap:12px;">
        <label style="font-size:0.85rem; font-weight:700;">Admin PIN (Default 7788)</label>
        <input type="password" id="adminPinInput" placeholder="Enter PIN to unlock" style="padding:10px; border-radius:8px; border:1px solid var(--gray-200);" />
        
        <div style="display:flex; gap:10px; margin-top:6px;">
          <button onclick="advanceMonth()" style="flex:1; background:var(--primary); color:white; border:none; padding:12px; border-radius:8px; font-weight:700;">Advance to Next Month</button>
          <button onclick="resetCycle()" style="flex:1; background:var(--danger-light); color:var(--danger); border:1px solid var(--danger); padding:12px; border-radius:8px; font-weight:700;">Reset Cycle</button>
        </div>
      </div>
    </section>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bhishi Group Manager</title>

  <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>

  <script src="[https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js](https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js)"></script>

  <style>
    :root {
      --primary: #4338ca;
      --primary-light: #eef2ff;
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      line-height: 1.5;
    }

    .cloud-status {
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .status-dot.synced { background: #10b981; }
    .status-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-size: 19px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

    main { max-width: 900px; margin: auto; padding: 16px; }

    .summary-card {
      background: linear-gradient(135deg, #3730a3 0%, #4f46e5 100%);
      color: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
    }

    .stat-pill { background: rgba(255,255,255,0.14); padding: 10px 12px; border-radius: 12px; backdrop-filter: blur(8px); }
    .stat-pill .label { font-size: 11px; opacity: 0.85; text-transform: uppercase; font-weight: 600; }
    .stat-pill .val { font-size: 17px; font-weight: 700; margin-top: 2px; }

    .progress-wrap { margin-top: 14px; background: rgba(0,0,0,0.2); border-radius: 10px; height: 8px; overflow: hidden; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

      background: var(--card-bg);

      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .name-title { font-weight: 700; font-size: 16px; line-height: 1.2; }
    .meta-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-paid { background: var(--success-light); color: var(--success); }
